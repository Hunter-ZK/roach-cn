# Temporary localization helper. It mirrors the original game files exactly, then changes only Korean UI strings to Simplified Chinese.
name: Sync upstream for localization

on:
  push:
    paths:
      - '.github/workflows/sync-localize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: aaffffffffff123-lang/roach
          ref: main
          path: upstream

      - name: Mirror original files and localize UI text only
        run: |
          cp upstream/index.html target/index.html
          cp upstream/game.html target/game.html
          cp upstream/specimen-lab.html target/specimen-lab.html
          rm -f target/README.md target/LICENSE target/translation-source.txt target/ui-korean.txt target/remaining-ui-korean.txt


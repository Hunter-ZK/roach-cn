              '고정 핀을 전부 뺐다': '已拔掉全部固定针',
              '고정할 부위를 정확히 누른다': '请准确点击要固定的部位',
              '집을 부위를 정확히 누른다': '请准确点击要夹取的部位',
              '고정됨': '已固定',
              '분리됨': '已分离',
              'SpecimenLab onChange 오류': 'SpecimenLab onChange 错误',
              '판을 싹 닦고 새 바퀴벌레를 올렸다': '已清理面板并放上新的蟑螂',
              '새 바퀴벌레로 교체했다': '已更换为新的蟑螂',
              '한 번 더 누르면 치움': '再点一次即可清除',
              '바로 놓기': '立即放置',
              '고정 핀 · 족집게로 누르면 뽑힌다': '固定针 · 用镊子点击即可拔出',
              'SpecimenLab.mount: 대상 컨테이너를 찾지 못했습니다.': 'SpecimenLab.mount：未找到目标容器。',
              'SpecimenLab onExit 오류': 'SpecimenLab onExit 错误',
            },
          }

          quote_re = re.compile(r'''([\"'`])((?:\\.|(?!\1).)*?)\1''')
          text_re = re.compile(r'>([^<>]*)<')
          hangul = re.compile(r'[가-힣]')

          def localize_line(line, mp):
              stripped = line.lstrip()
              if stripped.startswith('//') or stripped.startswith('/*') or stripped.startswith('*') or stripped.startswith('<!--'):
                  return line

              def qrep(m):
                  q, body = m.group(1), m.group(2)
                  if body in mp:
                      return q + mp[body] + q
                  return m.group(0)

              line = quote_re.sub(qrep, line)

              def trep(m):
                  body = m.group(1)
                  key = body.strip()
                  if key not in mp:
                      return m.group(0)
                  left = body[:len(body)-len(body.lstrip())]
                  right = body[len(body.rstrip()):]
                  return '>' + left + mp[key] + right + '<'

              return text_re.sub(trep, line)

          remaining = []
          for name, mp in MAPS.items():
              p = root / name
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              for line in lines:
                  out.append(localize_line(line, mp))
              text = ''.join(out).replace('<html lang="ko">', '<html lang="zh-CN">')
              p.write_text(text, encoding='utf-8')

              for lineno, line in enumerate(text.splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith('//') or stripped.startswith('/*') or stripped.startswith('*') or stripped.startswith('<!--'):
                      continue
                  for m in quote_re.finditer(line):
                      if hangul.search(m.group(2)):
                          remaining.append(f'{name}:{lineno}: {m.group(2)}')
                  for m in text_re.finditer(line):
                      body = m.group(1).strip()
                      if body and hangul.search(body):
                          remaining.append(f'{name}:{lineno}: {body}')

          if remaining:
              print('Untranslated Korean UI strings remain:')
              print('\n'.join(remaining))
              raise SystemExit(1)
          PY

      - name: Commit Chinese localization
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: Chinese localization of original game"
            git push
          fi

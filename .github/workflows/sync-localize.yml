              '${SIDE_NAME[side]} 꼬리감각돌기 ${i+1}마디': '${SIDE_NAME[side]}尾须第${i+1}节',
              '${SIDE_NAME[side]} 겉날개': '${SIDE_NAME[side]}前翅',
              '${SIDE_NAME[side]} 속날개': '${SIDE_NAME[side]}后翅',
              '${SIDE_NAME[side]} ${LEG_NAME[def.pair]} 발톱': '${SIDE_NAME[side]}${LEG_NAME[def.pair]}爪',

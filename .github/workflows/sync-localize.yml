# Temporary localization helper. It mirrors the original game files exactly and extracts only Hangul-bearing UI strings.
name: Sync upstream for localization

on:
  push:
    paths:
      - '.github/workflows/sync-localize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: aaffffffffff123-lang/roach
          ref: main
          path: upstream

      - name: Mirror original game files and extract Korean UI strings
        run: |
          cp upstream/index.html target/index.html
          cp upstream/game.html target/game.html
          cp upstream/specimen-lab.html target/specimen-lab.html
          rm -f target/README.md target/LICENSE
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('target')
          files = [root/'index.html', root/'game.html', root/'specimen-lab.html']
          hangul = re.compile(r'[가-힣]')
          quote_re = re.compile(r'''([\"'`])((?:\\.|(?!\1).)*?)\1''')
          text_re = re.compile(r'>([^<>]*[가-힣][^<>]*)<')
          seen = set()
          out = []

          for p in files:
              out.append(f'### {p.name}')
              for lineno, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  vals = []
                  for m in quote_re.finditer(line):
                      val = m.group(2)
                      if hangul.search(val):
                          vals.append(val)
                  for m in text_re.finditer(line):
                      val = m.group(1).strip()
                      if val and hangul.search(val):
                          vals.append(val)
                  for val in vals:
                      key = (p.name, val)
                      if key in seen:
                          continue
                      seen.add(key)
                      out.append(f'{lineno}\t{val}')
              out.append('')

          (root/'ui-korean.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit mirrored source and extraction report
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: extract Korean UI strings from original game"
            git push
          fi
